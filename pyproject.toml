[project]
name = "pncp-etl"
version = "0.1.0"
description = "Pipeline ETL de Atas de Registro de Precos do PNCP"
requires-python = "==3.13.*"
dependencies = [
    "apache-airflow==3.3.2",
    "apache-airflow-providers-postgres==7.0.2",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.5",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.6"
constraint-dependencies = [
    "apache-airflow-providers-common-compat==1.19.0",
    "apache-airflow-providers-common-sql==2.1.1",
    "anyio==4.15.1",
    "cryptography==46.0.3",
    "httpcore==1.0.9",
    "pendulum==3.2.0",
    "sqlalchemy==2.0.52",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "D", "E4", "E7", "E9", "F", "I", "SIM", "UP"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
